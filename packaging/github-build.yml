name: build

on:
  push:
    branches: [desktop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install
        run: python -m pip install --disable-pip-version-check -r requirements.txt pywebview==6.2.1
      - name: Tests
        # failures go out as one annotation: job logs need a login, annotations do not
        run: |
          python -m unittest discover tests > test.log 2>&1 && tail -3 test.log || {
            echo "::error title=tests::$(tail -c 6000 test.log | python -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "").replace("\n", "%0A"))')"
            exit 1; }
      - name: Window libraries load (gate B, Windows)
        if: always()
        run: python -c "import webview, clr; from webview.platforms import winforms; print('pywebview ok')"
      - name: Server answers (demo)
        if: always()
        run: |
          python server.py --demo --no-browser --port 8765 > server.log 2>&1 &
          for i in $(seq 30); do curl -sf -o page.html http://127.0.0.1:8765/ && break; sleep 1; done
          grep -q 'name="dorie-token"' page.html || {
            echo "::error title=server::$(tr -d '\r' < server.log | tr '\n' ' ' | tail -c 3000)"; exit 1; }
          echo "page ok"
