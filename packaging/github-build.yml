# GitHub Actions: tests and builds on Windows and the Mac; the files are downloadable from the run page.
# Lives here, not in .github/workflows/, until the token that pushes from the Mac has the `workflow` permission
# (GitHub refuses workflow files otherwise). Then:  git mv packaging/github-build.yml .github/workflows/build.yml
name: build

on:
  push:
    branches: [desktop, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  DORIEPLAY_SONGBASE: ''

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40   # a modal error box in the built program would otherwise hang the job for hours
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install
        run: python -m pip install --disable-pip-version-check -r requirements-window.txt pyinstaller==6.22.3
      - name: Tests
        # failures go out as one annotation: job logs need a login, annotations do not
        run: |
          python -m unittest discover tests > test.log 2>&1 && tail -3 test.log || {
            echo "::error title=tests::$(tail -c 6000 test.log | python -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "").replace("\n", "%0A"))')"
            exit 1; }
      - name: Build the Store package
        run: pwsh -File packaging/windows/build.ps1
      - name: Check the built program
        # the demo, served without a window: page, files, API, a whole demo search; then nothing private inside
        run: |
          fail() { echo "::error title=built program::$1"; exit 1; }
          ./dist/DoriePlay/DoriePlay.exe --self-test || fail "window libraries do not load"
          ./dist/DoriePlay/DoriePlay.exe --demo --no-window --port 8790 &
          trap 'kill $! 2>/dev/null' EXIT
          for i in $(seq 30); do curl -sf -o page.html http://127.0.0.1:8790/ && break; sleep 1; done
          token=$(sed -n 's/.*name="dorie-token" content="\([^"]*\)".*/\1/p' page.html 2>/dev/null || true)
          test -n "$token" || fail "the page did not load on port 8790"
          for f in app.js app.css i18n.js mascot.js logo.svg; do
            curl -sf -o /dev/null "http://127.0.0.1:8790/$f" || fail "/$f missing"; done
          api() { curl -sf -H "X-Dorie-Token: $token" -H 'Content-Type: application/json' "$@"; }
          api -o /dev/null http://127.0.0.1:8790/api/state || fail "/api/state failed"
          api -d '{"url": "https://open.spotify.com/playlist/demo", "to": "youtube"}' http://127.0.0.1:8790/api/plans > /dev/null ||
            fail "a demo search did not start"
          for i in $(seq 60); do api http://127.0.0.1:8790/api/job | grep -q '"state": "done"' && break; sleep 1; done
          api http://127.0.0.1:8790/api/job | grep -q '"state": "done"' || fail "the demo search did not finish"
          test -f dist/DoriePlay/_internal/certifi/cacert.pem || fail "no certifi"
          test -f dist/DoriePlay/_internal/THIRD-PARTY-NOTICES.md || fail "no licence notices"
          ls -d dist/DoriePlay/_internal/pythonnet-*.dist-info > /dev/null || fail "no pythonnet licence"
          found=$(find dist/DoriePlay \( -name '*.sqlite' -o -name 'CLAUDE.md' -o -name '*token*.json' -o -name plans -o -name design \) -print)
          test -z "$found" || fail "private files in the build: $found"
          echo "built program ok"
      - uses: actions/upload-artifact@v4
        with:
          name: DoriePlay-windows
          # the .msix for the Store; build/msix is the same package unpacked, to try it on a PC with Developer Mode:
          #   Add-AppxPackage -Register build\msix\AppxManifest.xml   (an unsigned .msix cannot be opened by double-click)
          path: |
            dist/DoriePlay-*.msix
            build/msix/

  mac:
    runs-on: macos-latest   # Apple silicon: the dmg is arm64 only
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install
        run: python -m pip install --disable-pip-version-check -r requirements-window.txt pyinstaller==6.22.3
      - name: Tests
        run: python -m unittest discover tests
      - name: Build
        run: sh packaging/mac/build.sh python
      - uses: actions/upload-artifact@v4
        with:
          name: DoriePlay-mac
          path: dist/DoriePlay-mac.dmg
