<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Dorie Play">
  <!-- Dorie Play logo "Hand-off" (chosen 14 Nov 2026): a song passing from one service card to another. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c2035"/><stop offset="1" stop-color="#120e17"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb07a"/><stop offset="0.45" stop-color="#ff8f5a"/><stop offset="1" stop-color="#ce408f"/></linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b7cf0"/><stop offset="1" stop-color="#ce408f"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="20" y="22" width="54" height="54" rx="16" fill="url(#back)" fill-opacity="0.85" transform="rotate(-10 47 49)"/>
  <rect x="44" y="42" width="54" height="54" rx="16" fill="url(#warm)"/>
  <rect x="44" y="42" width="54" height="54" rx="16" fill="url(#shine)"/>
  <rect x="44.6" y="42.6" width="52.8" height="52.8" rx="15.4" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="1.2"/>
  <path d="M64 59 L80 69 L64 79 Z" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  <rect x="0.75" y="0.75" width="118.5" height="118.5" rx="27.5" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="1.5"/>
</svg>
